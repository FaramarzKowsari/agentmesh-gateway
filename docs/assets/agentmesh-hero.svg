<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AgentMesh Gateway architecture</title><desc id="desc">A visual overview of clients, protocol normalization, feasibility gates, routing policies, providers, and research simulation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0b2037"/><stop offset="1" stop-color="#07101a"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43d9ff"/><stop offset="1" stop-color="#5b8cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/><circle cx="1320" cy="120" r="230" fill="#183d63" opacity=".28"/><circle cx="260" cy="760" r="260" fill="#0d6a78" opacity=".18"/><g opacity=".18" stroke="#43d9ff"><path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/><path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/></g><text x="110" y="120" fill="#43d9ff" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="5">AGENTMESH GATEWAY · v0.3.0</text><text x="110" y="205" fill="#f1f8ff" font-family="Arial,sans-serif" font-size="74" font-weight="800">Feasibility before optimization</text><text x="112" y="255" fill="#9fb1c5" font-family="Arial,sans-serif" font-size="27">A protocol-aware gateway and reproducible routing research substrate</text><g font-family="Arial,sans-serif"><g><rect x="95" y="355" width="220" height="180" rx="24" fill="#0d1d31" stroke="#2c4d6d"/><text x="125" y="405" fill="#f0f8ff" font-size="25" font-weight="700">Clients</text><text x="125" y="450" fill="#9fb1c5" font-size="20">Codex</text><text x="125" y="482" fill="#9fb1c5" font-size="20">OpenAI-shaped</text><text x="125" y="514" fill="#9fb1c5" font-size="20">Anthropic-shaped</text></g><g><rect x="365