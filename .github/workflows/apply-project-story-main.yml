name: apply-project-story-main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: startsWith(github.event.issue.title, 'project-story-sync:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Add visible multilingual project story to landing pages
        shell: python
        run: |
          from pathlib import Path

          stories = {
              "docs/index.html": r'''<section id="project-story" class="story-section"><div class="section-title"><h2>Project story: how AgentMesh reached v0.3.0</h2><p>A plain-language timeline of why the project was started, what changed at each stage, why the current boundary exists, and where the architecture can grow next.</p></div><div class="story-panel"><div class="story-kicker">WHY THIS PROJECT EXISTS</div><h3>One stable gateway, without pretending every AI provider is interchangeable.</h3><p>AgentMesh began on 22 August 2026 as an independent implementation built around a practical problem: coding agents and AI clients increasingly need several local and remote model providers, but those providers differ in protocol, tools, reasoning semantics, price, latency, reliability and quotas. A simple “pick the cheapest model” router can therefore make the wrong decision before optimization even begins. The project was designed around a stricter rule: first determine which providers can preserve the request safely and meaningfully; only then optimize among the feasible choices.</p></div><div class="timeline"><article class="timeline-item"><span class="timeline-badge">Start</span><h3>Independent foundation</h3><p>The repository was bootstrapped as an original Apache-2.0 project with explicit provenance rules, a protocol-neutral domain model, FastAPI ingress, environment-driven provider configuration and tests that require no paid API key.</p><p class="story-why"><strong>Why this came first:</strong> without a neutral core, every future provider would leak vendor-specific assumptions into routing and make research comparisons unreliable.</p></article><article class="timeline-item"><span class="timeline-badge">v0.1</span><h3>Gateway mechanics became real</h3><p>OpenAI-shaped Chat Completions, a partial Responses surface and Anthropic-shaped Messages were connected to generic provider adapters. Ordered, latency, cost, quality and balanced routing, fallback, retry normalization, circuit breaking, optional bearer authentication and CI across Python 3.11–3.13 formed the first working product boundary.</p><p class="story-why"><strong>Why the project moved on:</strong> a gateway that only forwards text is useful, but coding agents also depend on streaming, function calls and protocol-specific semantics.</p></article><article class="timeline-item"><span class="timeline-badge">v0.2</span><h3>Compatibility was hardened instead of overclaimed</h3><p>The Responses lifecycle was expanded, custom function-call loops and streaming tool deltas were normalized, a Codex contract harness was added, native Responses reasoning and recognised built-in tools could be preserved, and unsupported semantics began returning explicit 4xx errors rather than being silently dropped.</p><p class="story-why"><strong>Why this mattered:</strong> “looks compatible” is dangerous if reasoning controls or tool semantics disappear during translation. v0.2 made semantic preservation an explicit routing constraint.</p></article><article class="timeline-item"><span class="timeline-badge">v0.3</span><h3>The gateway became a research substrate</h3><p>Capability-aware feasibility, observed token/cost accounting, EWMA plus bounded p50/p95 latency evidence, deterministic local quota windows, a no-network policy simulator, provenance-checked quality profiles and simulation-only <code>adaptive_balanced</code> and <code>constrained_ucb</code> baselines were added. The release was archived on Zenodo and documented through GitHub Pages.</p><p class="story-why"><strong>Why the architecture changed here:</strong> the project was no longer only asking “which provider should serve this request?” It could now study that decision reproducibly under cost, latency, capability, failure and quota constraints.</p></article></div><div class="status-grid"><article class="status-card"><div class="story-kicker">WHERE IT IS NOW</div><h3>A tested gateway + reproducible routing laboratory</h3><p>Today the project offers three client-facing protocol families, three upstream adapter families, feasibility-first production routing, bounded fallback, runtime evidence, local quota controls, offline simulation, architectural decision records, CI, Docker, DOI-backed release metadata and a three-language documentation site.</p></article><article class="status-card"><div class="story-kicker">WHY IT STOPS HERE FOR NOW</div><h3>The remaining boundaries are intentional</h3><p>v0.3.0 does not claim full OpenAI Responses compatibility, does not silently translate semantics it cannot preserve, and does not enable adaptive policies in live production routing. Vision, audio and other multimodal dimensions are also deferred until the normalized request model can represent them without loss. These are safety and research-integrity boundaries, not unfinished marketing claims.</p></article><article class="status-card"><div class="story-kicker">WHAT A RESEARCHER GETS</div><h3>A controlled experimental surface</h3><p>A researcher can replay identical traces across static and adaptive policies, inspect feasible provider sets, measure observed latency/cost evidence, model local quota pressure, attach benchmark provenance to quality profiles, export JSON/CSV results and extend routing logic without paying for live provider calls during deterministic experiments.</p></article></div><div class="section-title future-title"><h2>Growth capacity: what can be added next?</h2><p>The current architecture deliberately leaves several high-value research and engineering directions open.</p></div><div class="future-grid"><article class="future-card"><h3>Multimodal feasibility</h3><p>Add vision, audio, context-window, structured-output and other capability dimensions after the neutral request model can represent them losslessly.</p></article><article class="future-card"><h3>Persistent control plane</h3><p>Add PostgreSQL/SQLite state, encrypted secret storage, provider validation, audit history and a dashboard for operational use.</p></article><article class="future-card"><h3>Production observability</h3><p>Add Prometheus/OpenTelemetry exporters, SLOs, long-horizon reliability statistics and richer cost/latency dashboards.</p></article><article class="future-card"><h3>More agent contracts</h3><p>Expand dedicated fixtures for Claude Code, Cline, OpenCode and additional Codex behaviours without weakening semantic gates.</p></article><article class="future-card"><h3>Real benchmark evidence</h3><p>Publish frozen coding/agent benchmark procedures, provider traces and quality profiles with explicit provenance so adaptive routing can be evaluated scientifically.</p></article><article class="future-card"><h3>Guarded production adaptation</h3><p>Move adaptive policies from simulator to live routing only after benchmark evidence, safety constraints, rollback rules and separate architecture review.</p></article></div><div class="story-actions"><a class="btn primary" href="project.html">Read the complete technical guide</a><a class="btn" href="https://github.com/FaramarzKowsari/agentmesh-gateway/blob/main/ROADMAP.md">Open the roadmap</a><a class="btn" href="https://doi.org/10.5281/zenodo.22069468">Cite v0.3.0</a></div></section>''',
              "docs/tr/index.html": r'''<section id="project-story" class="story-section"><div class="section-title"><h2>Projenin yolculuğu: AgentMesh v0.3.0’a nasıl ulaştı?</h2><p>Projenin neden başladığını, her aşamada neyin değiştiğini, bugünkü sınırların neden bilinçli olduğunu ve mimarinin bundan sonra nereye büyüyebileceğini sade dille anlatan zaman çizelgesi.</p></div><div class="story-panel"><div class="story-kicker">BU PROJE NEDEN VAR?</div><h3>Her AI sağlayıcısının aynı olduğunu varsaymadan tek ve kararlı bir ağ geçidi.</h3><p>AgentMesh, 22 Ağustos 2026’da bağımsız bir uygulama olarak pratik bir sorundan doğdu: kodlama ajanları ve AI istemcileri giderek daha fazla yerel ve uzak model sağlayıcısıyla çalışıyor; ancak bu sağlayıcılar protokol, araç kullanımı, reasoning semantiği, fiyat, gecikme, güvenilirlik ve kota açısından aynı değil. Bu yüzden yalnızca “en ucuz modeli seç” yaklaşımı optimizasyon başlamadan yanlış karar verebilir. Projenin temel kuralı daha katıdır: önce isteği güvenli ve anlamlı biçimde koruyabilecek sağlayıcıları belirle, sonra yalnızca uygun seçenekler arasında optimizasyon yap.</p></div><div class="timeline"><article class="timeline-item"><span class="timeline-badge">Başlangıç</span><h3>Bağımsız temel</h3><p>Depo; açık provenance kuralları, protokolden bağımsız alan modeli, FastAPI giriş katmanı, ortam değişkenleriyle sağlayıcı yapılandırması ve ücretli API anahtarı gerektirmeyen testlerle özgün bir Apache-2.0 projesi olarak kuruldu.</p><p class="story-why"><strong>Neden önce bu yapıldı?</strong> Tarafsız bir çekirdek olmadan her yeni sağlayıcı routing katmanına vendor varsayımları taşır ve araştırma karşılaştırmalarını güvenilmez hâle getirirdi.</p></article><article class="timeline-item"><span class="timeline-badge">v0.1</span><h3>Gateway mekanikleri gerçek bir ürüne dönüştü</h3><p>OpenAI biçimli Chat Completions, kısmi Responses yüzeyi ve Anthropic biçimli Messages; genel sağlayıcı adapter’larına bağlandı. Ordered, latency, cost, quality ve balanced routing; fallback, retry normalizasyonu, circuit breaker, isteğe bağlı bearer authentication ve Python 3.11–3.13 CI ilk çalışan ürün sınırını oluşturdu.</p><p class="story-why"><strong>Neden sonraki aşamaya geçildi?</strong> Yalnızca metin ileten bir gateway yararlıdır; fakat kodlama ajanları streaming, function calling ve protokole özgü semantiğe de ihtiyaç duyar.</p></article><article class="timeline-item"><span class="timeline-badge">v0.2</span><h3>Uyumluluk abartılmak yerine sertleştirildi</h3><p>Responses yaşam döngüsü genişletildi, özel function-call döngüleri ve streaming tool delta’ları normalize edildi, Codex contract harness eklendi, native Responses reasoning ve tanınan built-in tool’lar korunabilir hâle geldi; desteklenmeyen semantiklerin sessizce kaybolması yerine açık 4xx hataları üretildi.</p><p class="story-why"><strong>Bu neden önemliydi?</strong> Reasoning kontrolleri veya tool semantiği çeviri sırasında kayboluyorsa “uyumlu görünüyor” demek tehlikelidir. v0.2 semantik korunmasını açık bir routing kısıtı yaptı.</p></article><article class="timeline-item"><span class="timeline-badge">v0.3</span><h3>Gateway bir araştırma altyapısına dönüştü</h3><p>Capability-aware feasibility, gözlenen token/maliyet muhasebesi, EWMA ile birlikte bounded p50/p95 gecikme kanıtı, deterministik yerel kota pencereleri, ağ bağlantısı gerektirmeyen policy simulator, provenance kontrollü quality profile’lar ve yalnızca simülasyonda çalışan <code>adaptive_balanced</code> ile <code>constrained_ucb</code> baseline’ları eklendi. Sürüm Zenodo’da arşivlendi ve GitHub Pages ile belgelendi.</p><p class="story-why"><strong>Mimari burada neden genişledi?</strong> Proje artık yalnızca “bu isteği hangi sağlayıcı çalıştırsın?” diye sormuyordu; maliyet, gecikme, capability, hata ve kota kısıtları altında bu kararı yeniden üretilebilir biçimde inceleyebiliyordu.</p></article></div><div class="status-grid"><article class="status-card"><div class="story-kicker">BUGÜN NEREDE?</div><h3>Test edilmiş gateway + yeniden üretilebilir routing laboratuvarı</h3><p>Bugün proje üç istemci protokol ailesi, üç upstream adapter ailesi, feasibility-first production routing, bounded fallback, runtime evidence, yerel kota kontrolü, offline simülasyon, ADR’ler, CI, Docker, DOI destekli sürüm metadata’sı ve üç dilli dokümantasyon sitesi sunuyor.</p></article><article class="status-card"><div class="story-kicker">NEDEN ŞİMDİLİK BURADA DURUYOR?</div><h3>Kalan sınırlar bilinçli</h3><p>v0.3.0 tam OpenAI Responses uyumluluğu iddia etmez, koruyamadığı semantiği sessizce çevirmeye çalışmaz ve adaptive policy’leri canlı production routing içinde otomatik açmaz. Vision, audio ve diğer multimodal boyutlar da neutral request model bunları kayıpsız temsil edene kadar ertelenmiştir. Bunlar eksik pazarlama değil, güvenlik ve araştırma bütünlüğü sınırlarıdır.</p></article><article class="status-card"><div class="story-kicker">ARAŞTIRMACIYA NE VERİYOR?</div><h3>Kontrollü deney yüzeyi</h3><p>Araştırmacı aynı trace’i statik ve adaptive policy’lerde tekrar oynatabilir; uygun sağlayıcı kümelerini inceleyebilir; gözlenen gecikme/maliyet kanıtını izleyebilir; yerel kota baskısını modelleyebilir; quality profile’lara benchmark provenance ekleyebilir; JSON/CSV çıktı alabilir ve deterministik deneylerde canlı provider maliyeti olmadan routing mantığını genişletebilir.</p></article></div><div class="section-title future-title"><h2>Büyüme kapasitesi: bundan sonra ne eklenebilir?</h2><p>Mevcut mimari yüksek değerli araştırma ve mühendislik yönleri için bilinçli olarak açık alan bırakıyor.</p></div><div class="future-grid"><article class="future-card"><h3>Multimodal uygunluk</h3><p>Neutral request model kayıpsız temsil edebildiğinde vision, audio, context-window, structured-output ve başka capability boyutları eklenebilir.</p></article><article class="future-card"><h3>Kalıcı control plane</h3><p>PostgreSQL/SQLite state, şifreli secret storage, provider doğrulama, audit geçmişi ve operasyonel dashboard eklenebilir.</p></article><article class="future-card"><h3>Production observability</h3><p>Prometheus/OpenTelemetry exporter’ları, SLO’lar, uzun dönem güvenilirlik istatistikleri ve gelişmiş maliyet/gecikme panoları eklenebilir.</p></article><article class="future-card"><h3>Daha fazla agent contract’ı</h3><p>Semantik kapıları zayıflatmadan Claude Code, Cline, OpenCode ve ek Codex davranışları için özel fixture’lar genişletilebilir.</p></article><article class="future-card"><h3>Gerçek benchmark kanıtı</h3><p>Adaptive routing’i bilimsel olarak değerlendirmek için sabitlenmiş coding/agent benchmark prosedürleri, provider trace’leri ve açık provenance’lı quality profile’lar yayımlanabilir.</p></article><article class="future-card"><h3>Koruma katmanlı production adaptation</h3><p>Adaptive policy’ler ancak benchmark kanıtı, güvenlik kısıtları, rollback kuralları ve ayrı mimari inceleme sonrasında simülatörden canlı routing’e taşınmalıdır.</p></article></div><div class="story-actions"><a class="btn primary" href="project.html">Tam teknik rehberi oku</a><a class="btn" href="https://github.com/FaramarzKowsari/agentmesh-gateway/blob/main/ROADMAP.md">Roadmap’i aç</a><a class="btn" href="https://doi.org/10.5281/zenodo.22069468">v0.3.0’a atıf yap</a></div></section>''',
              "docs/es/index.html": r'''<section id="project-story" class="story-section"><div class="section-title"><h2>Historia del proyecto: cómo AgentMesh llegó a v0.3.0</h2><p>Una cronología en lenguaje claro que explica por qué nació el proyecto, qué cambió en cada etapa, por qué existen los límites actuales y hacia dónde puede crecer la arquitectura.</p></div><div class="story-panel"><div class="story-kicker">POR QUÉ EXISTE ESTE PROYECTO</div><h3>Un único gateway estable sin fingir que todos los proveedores de IA son intercambiables.</h3><p>AgentMesh comenzó el 22 de agosto de 2026 como una implementación independiente nacida de un problema práctico: los agentes de programación y los clientes de IA necesitan trabajar cada vez con más proveedores locales y remotos, pero esos proveedores difieren en protocolo, herramientas, semántica de reasoning, precio, latencia, fiabilidad y cuotas. Por eso, un router que simplemente “elige el modelo más barato” puede equivocarse antes de que empiece la optimización. El proyecto se diseñó con una regla más estricta: primero determinar qué proveedores pueden conservar la solicitud de forma segura y significativa; después optimizar únicamente entre las opciones viables.</p></div><div class="timeline"><article class="timeline-item"><span class="timeline-badge">Inicio</span><h3>Base independiente</h3><p>El repositorio se creó como un proyecto original Apache-2.0 con reglas explícitas de procedencia, un modelo de dominio neutral respecto al protocolo, una capa de entrada FastAPI, configuración de proveedores mediante variables de entorno y pruebas que no requieren ninguna API de pago.</p><p class="story-why"><strong>Por qué fue lo primero:</strong> sin un núcleo neutral, cada proveedor nuevo introduciría supuestos de vendor en el routing y haría menos fiables las comparaciones de investigación.</p></article><article class="timeline-item"><span class="timeline-badge">v0.1</span><h3>La mecánica del gateway se convirtió en producto</h3><p>Chat Completions con forma OpenAI, una superficie parcial de Responses y Messages con forma Anthropic se conectaron a adaptadores genéricos. El routing ordered, latency, cost, quality y balanced, junto con fallback, normalización de reintentos, circuit breaker, autenticación bearer opcional y CI en Python 3.11–3.13 formaron el primer límite funcional del producto.</p><p class="story-why"><strong>Por qué había que avanzar:</strong> un gateway que solo reenvía texto es útil, pero los agentes de programación también dependen de streaming, llamadas a funciones y semántica propia del protocolo.</p></article><article class="timeline-item"><span class="timeline-badge">v0.2</span><h3>La compatibilidad se endureció en lugar de exagerarse</h3><p>Se amplió el ciclo de vida de Responses, se normalizaron los bucles de function calls y los tool deltas en streaming, se añadió un Codex contract harness, se pudieron preservar el reasoning nativo de Responses y las herramientas integradas reconocidas, y la semántica no compatible empezó a devolver errores 4xx explícitos en lugar de desaparecer en silencio.</p><p class="story-why"><strong>Por qué era importante:</strong> decir que algo “parece compatible” es peligroso si los controles de reasoning o la semántica de herramientas se pierden durante la traducción. v0.2 convirtió la preservación semántica en una restricción explícita de routing.</p></article><article class="timeline-item"><span class="timeline-badge">v0.3</span><h3>El gateway se convirtió en una plataforma de investigación</h3><p>Se añadieron feasibility basada en capacidades, contabilidad observada de tokens/coste, evidencia de latencia EWMA más p50/p95 acotada, ventanas deterministas de cuota local, un simulador de políticas sin red, perfiles de calidad con procedencia verificable y los baselines <code>adaptive_balanced</code> y <code>constrained_ucb</code>, solo para simulación. La versión se archivó en Zenodo y se documentó mediante GitHub Pages.</p><p class="story-why"><strong>Por qué cambió aquí la arquitectura:</strong> el proyecto dejó de preguntar solo “¿qué proveedor debe atender esta solicitud?” y pasó a poder estudiar esa decisión de forma reproducible bajo restricciones de coste, latencia, capacidad, fallos y cuota.</p></article></div><div class="status-grid"><article class="status-card"><div class="story-kicker">DÓNDE ESTÁ AHORA</div><h3>Gateway probado + laboratorio reproducible de routing</h3><p>Hoy ofrece tres familias de protocolos de cliente, tres familias de adaptadores upstream, routing de producción con feasibility primero, fallback acotado, evidencia de runtime, control local de cuotas, simulación offline, ADR, CI, Docker, metadatos de versión con DOI y un sitio de documentación en tres idiomas.</p></article><article class="status-card"><div class="story-kicker">POR QUÉ SE DETIENE AQUÍ DE MOMENTO</div><h3>Los límites restantes son deliberados</h3><p>v0.3.0 no afirma compatibilidad completa con OpenAI Responses, no traduce en silencio semántica que no puede preservar y no activa políticas adaptativas en el routing de producción. Vision, audio y otras dimensiones multimodales también se aplazan hasta que el modelo normalizado pueda representarlas sin pérdida. Son límites de seguridad e integridad investigadora, no afirmaciones de marketing incompletas.</p></article><article class="status-card"><div class="story-kicker">QUÉ RECIBE UN INVESTIGADOR</div><h3>Una superficie experimental controlada</h3><p>Un investigador puede reproducir las mismas trazas con políticas estáticas y adaptativas, inspeccionar conjuntos de proveedores viables, medir evidencia observada de latencia/coste, modelar presión de cuotas locales, adjuntar procedencia de benchmark a perfiles de calidad, exportar JSON/CSV y ampliar el routing sin pagar llamadas reales durante experimentos deterministas.</p></article></div><div class="section-title future-title"><h2>Capacidad de crecimiento: ¿qué puede añadirse después?</h2><p>La arquitectura actual deja deliberadamente abiertas varias líneas de ingeniería e investigación de alto valor.</p></div><div class="future-grid"><article class="future-card"><h3>Feasibility multimodal</h3><p>Añadir vision, audio, ventana de contexto, garantías de salida estructurada y otras capacidades cuando el modelo neutral pueda representarlas sin pérdida.</p></article><article class="future-card"><h3>Plano de control persistente</h3><p>Añadir estado PostgreSQL/SQLite, almacenamiento cifrado de secretos, validación de proveedores, historial de auditoría y dashboard operativo.</p></article><article class="future-card"><h3>Observabilidad de producción</h3><p>Añadir exportadores Prometheus/OpenTelemetry, SLO, estadísticas de fiabilidad a largo plazo y paneles más ricos de coste y latencia.</p></article><article class="future-card"><h3>Más contratos de agentes</h3><p>Ampliar fixtures específicos para Claude Code, Cline, OpenCode y más comportamientos de Codex sin debilitar las barreras semánticas.</p></article><article class="future-card"><h3>Evidencia de benchmarks reales</h3><p>Publicar procedimientos congelados de benchmarks de coding/agentes, trazas de proveedores y perfiles de calidad con procedencia explícita para evaluar científicamente el routing adaptativo.</p></article><article class="future-card"><h3>Adaptación de producción con guardas</h3><p>Mover políticas adaptativas del simulador al routing real solo después de disponer de evidencia de benchmark, restricciones de seguridad, reglas de rollback y revisión arquitectónica separada.</p></article></div><div class="story-actions"><a class="btn primary" href="project.html">Leer la guía técnica completa</a><a class="btn" href="https://github.com/FaramarzKowsari/agentmesh-gateway/blob/main/ROADMAP.md">Abrir el roadmap</a><a class="btn" href="https://doi.org/10.5281/zenodo.22069468">Citar v0.3.0</a></div></section>''',
          }

          hero_buttons = {
              "docs/index.html": ('<a class="btn primary" href="project.html">Explore how the project works</a>', '<a class="btn primary" href="#project-story">Project story &amp; roadmap</a><a class="btn" href="project.html">Complete technical guide</a>'),
              "docs/tr/index.html": ('<a class="btn primary" href="project.html">Proje nasıl çalışıyor?</a>', '<a class="btn primary" href="#project-story">Projenin yolculuğu ve gelecek</a><a class="btn" href="project.html">Tam teknik rehber</a>'),
              "docs/es/index.html": ('<a class="btn primary" href="project.html">Ver cómo funciona el proyecto</a>', '<a class="btn primary" href="#project-story">Historia y futuro del proyecto</a><a class="btn" href="project.html">Guía técnica completa</a>'),
          }

          markers = {
              "docs/index.html": '<section><div class="section-title"><h2>What makes AgentMesh different?</h2>',
              "docs/tr/index.html": '<section><div class="section-title"><h2>AgentMesh\'i farklı yapan nedir?</h2>',
              "docs/es/index.html": '<section><div class="section-title"><h2>¿Qué hace diferente a AgentMesh?</h2>',
          }

          for file_name, story in stories.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              if 'id="project-story"' in text:
                  raise SystemExit(f"project story already exists in {file_name}")
              old_button, new_button = hero_buttons[file_name]
              if old_button not in text:
                  raise SystemExit(f"hero button marker missing in {file_name}")
              text = text.replace(old_button, new_button, 1)
              marker = markers[file_name]
              if marker not in text:
                  raise SystemExit(f"section marker missing in {file_name}")
              text = text.replace(marker, story + marker, 1)
              path.write_text(text, encoding="utf-8")

          css_path = Path("docs/assets/site.css")
          css = css_path.read_text(encoding="utf-8")
          addition = r'''.story-section{scroll-margin-top:20px}.story-panel{margin-bottom:18px;padding:26px;border:1px solid rgba(67,217,255,.36);border-radius:24px;background:linear-gradient(135deg,rgba(67,217,255,.10),rgba(91,140,255,.08));box-shadow:var(--shadow)}.story-panel h3{font-size:clamp(24px,3.4vw,38px);line-height:1.15;margin:8px 0 12px}.story-panel p{margin:0;color:#c9d9e8}.story-kicker{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--cyan)}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.timeline-item,.status-card,.future-card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(17,40,66,.92),rgba(8,19,33,.94));padding:20px}.timeline-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(67,217,255,.13);border:1px solid rgba(67,217,255,.38);color:var(--cyan);font-size:12px;font-weight:900}.timeline-item h3,.status-card h3,.future-card h3{margin:12px 0 8px}.timeline-item p,.status-card p,.future-card p{color:var(--muted);margin:0}.timeline-item .story-why{margin-top:12px;color:#d8e8f7}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.future-title{margin-top:28px}.future-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.story-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}@media(max-width:980px){.timeline{grid-template-columns:1fr 1fr}.status-grid,.future-grid{grid-template-columns:1fr 1fr}}@media(max-width:680px){.timeline,.status-grid,.future-grid{grid-template-columns:1fr}.story-panel,.timeline-item,.status-card,.future-card{padding:18px}}'''
          if '.story-section{' not in css:
              css += addition
          css_path.write_text(css, encoding="utf-8")

      - name: Verify multilingual project story
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Project story: how AgentMesh reached v0.3.0' docs/index.html
          grep -q 'Projenin yolculuğu: AgentMesh v0.3.0' docs/tr/index.html
          grep -q 'Historia del proyecto: cómo AgentMesh llegó a v0.3.0' docs/es/index.html
          grep -q 'WHY IT STOPS HERE FOR NOW' docs/index.html
          grep -q 'NEDEN ŞİMDİLİK BURADA DURUYOR' docs/tr/index.html
          grep -q 'POR QUÉ SE DETIENE AQUÍ DE MOMENTO' docs/es/index.html
          grep -q 'Growth capacity: what can be added next?' docs/index.html
          grep -q 'Büyüme kapasitesi: bundan sonra ne eklenebilir?' docs/tr/index.html
          grep -q 'Capacidad de crecimiento: ¿qué puede añadirse después?' docs/es/index.html
          grep -q '.story-section' docs/assets/site.css
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/tr/index.html docs/es/index.html docs/assets/site.css
          git commit -m "docs: add multilingual project story and growth roadmap"
          git push origin main
      - name: Record success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'Multilingual project story completed: English, Turkish and Spain Spanish landing pages now include the origin, v0.1/v0.2/v0.3 evolution, current boundary, researcher deliverables and future growth capacity in a prominent section linked from the hero.'
          gh issue close "$ISSUE_NUMBER"
