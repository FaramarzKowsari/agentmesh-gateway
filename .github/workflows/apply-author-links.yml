name: apply-author-links

on:
  push:
    branches: [chore/complete-author-profile-links]
    paths:
      - ".github/workflows/apply-author-links.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/complete-author-profile-links
      - name: Complete multilingual author profile links
        shell: python
        run: |
          from pathlib import Path

          website = "https://FaramarzKowsari.github.io"
          books = "https://play.google.com/store/search?q=Faramarz%20Kowsari&c=books"
          scholar = "https://scholar.google.com/citations?user=G7tP5WMAAAAJ&hl=en"
          github = "https://github.com/FaramarzKowsari"
          linkedin = "https://www.linkedin.com/in/faramarzkowsari"
          orcid = "https://orcid.org/0000-0003-1692-0453"

          replacements = {
              "docs/index.html": [
                  (
                      '<div class="profile-links"><a href="#author">Full biography</a><a href="https://FaramarzKowsari.github.io">Official Website</a><a href="https://www.linkedin.com/in/faramarzkowsari">LinkedIn</a></div>',
                      f'<div class="profile-links"><a href="#author">Full biography</a><a href="{website}">Official Website</a><a href="{books}">Google Play Books</a><a href="{scholar}">Google Scholar</a><a href="{github}">GitHub</a><a href="{linkedin}">LinkedIn</a><a href="{orcid}">ORCID</a></div>'
                  ),
                  (
                      '<div class="official"><a href="https://FaramarzKowsari.github.io">Official Website</a><a href="https://play.google.com/store/search?q=Faramarz%20Kowsari&c=books">Google Play Books</a><a href="https://www.linkedin.com/in/faramarzkowsari">LinkedIn</a></div>',
                      f'<div class="official"><a href="{website}">Official Website</a><a href="{books}">Google Play Books</a><a href="{scholar}">Google Scholar</a><a href="{github}">GitHub</a><a href="{linkedin}">LinkedIn</a><a href="{orcid}">ORCID</a></div>'
                  ),
                  (
                      '"sameAs":["https://www.linkedin.com/in/faramarzkowsari","https://play.google.com/store/search?q=Faramarz%20Kowsari&c=books"]',
                      f'"sameAs":["{books}","{scholar}","{github}","{linkedin}","{orcid}"]'
                  ),
              ],
              "docs/tr/index.html": [
                  (
                      '<div class="profile-links"><a href="#author">Tam biyografi</a><a href="https://FaramarzKowsari.github.io">Resmî Web Sitesi</a><a href="https://www.linkedin.com/in/faramarzkowsari">LinkedIn</a></div>',
                      f'<div class="profile-links"><a href="#author">Tam biyografi</a><a href="{website}">Resmî Web Sitesi</a><a href="{books}">Google Play Books</a><a href="{scholar}">Google Scholar</a><a href="{github}">GitHub</a><a href="{linkedin}">LinkedIn</a><a href="{orcid}">ORCID</a></div>'
                  ),
                  (
                      '<div class="official"><a href="https://FaramarzKowsari.github.io">Resmî Web Sitesi</a><a href="https://play.google.com/store/search?q=Faramarz%20Kowsari&c=books">Google Play Books</a><a href="https://www.linkedin.com/in/faramarzkowsari">LinkedIn</a></div>',
                      f'<div class="official"><a href="{website}">Resmî Web Sitesi</a><a href="{books}">Google Play Books</a><a href="{scholar}">Google Scholar</a><a href="{github}">GitHub</a><a href="{linkedin}">LinkedIn</a><a href="{orcid}">ORCID</a></div>'
                  ),
              ],
              "docs/es/index.html": [
                  (
                      '<div class="profile-links"><a href="#author">Biografía completa</a><a href="https://FaramarzKowsari.github.io">Sitio oficial</a><a href="https://www.linkedin.com/in/faramarzkowsari">LinkedIn</a></div>',
                      f'<div class="profile-links"><a href="#author">Biografía completa</a><a href="{website}">Sitio oficial</a><a href="{books}">Google Play Books</a><a href="{scholar}">Google Scholar</a><a href="{github}">GitHub</a><a href="{linkedin}">LinkedIn</a><a href="{orcid}">ORCID</a></div>'
                  ),
                  (
                      '<div class="official"><a href="https://FaramarzKowsari.github.io">Sitio oficial</a><a href="https://play.google.com/store/search?q=Faramarz%20Kowsari&c=books">Google Play Books</a><a href="https://www.linkedin.com/in/faramarzkowsari">LinkedIn</a></div>',
                      f'<div class="official"><a href="{website}">Sitio oficial</a><a href="{books}">Google Play Books</a><a href="{scholar}">Google Scholar</a><a href="{github}">GitHub</a><a href="{linkedin}">LinkedIn</a><a href="{orcid}">ORCID</a></div>'
                  ),
              ],
          }

          for path_str, pairs in replacements.items():
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected author-profile fragment not found in {path_str}: {old[:80]}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Verify author links
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/index.html docs/tr/index.html docs/es/index.html; do
            grep -q 'https://FaramarzKowsari.github.io' "$file"
            grep -q 'play.google.com/store/search?q=Faramarz%20Kowsari&c=books' "$file"
            grep -q 'scholar.google.com/citations?user=G7tP5WMAAAAJ&hl=en' "$file"
            grep -q 'https://github.com/FaramarzKowsari' "$file"
            grep -q 'https://www.linkedin.com/in/faramarzkowsari' "$file"
            grep -q 'https://orcid.org/0000-0003-1692-0453' "$file"
          done
      - name: Commit author profile links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/tr/index.html docs/es/index.html
          git commit -m "docs: complete author profile links"
          git push
