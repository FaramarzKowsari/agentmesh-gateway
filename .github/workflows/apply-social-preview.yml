name: apply-social-preview

on:
  push:
    branches: [chore/social-preview-and-doi]
    paths:
      - ".github/workflows/apply-social-preview.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/social-preview-and-doi
      - name: Patch README and multilingual index pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo_url = "https://faramarzkowsari.github.io/agentmesh-gateway/"
          image_url = repo_url + "social-preview.jpg"
          doi_url = "https://doi.org/10.5281/zenodo.22069468"

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "[![DOI](https://zenodo.org/badge/1343123888.svg)](https://doi.org/10.5281/zenodo.22069468)"
          new = """[![AgentMesh Gateway social preview](docs/social-preview.jpg)](https://faramarzkowsari.github.io/agentmesh-gateway/)\n\n[![DOI](https://img.shields.io/badge/DOI-10.5281%2Fzenodo.22069468-1682D4?logo=zenodo&logoColor=white)](https://doi.org/10.5281/zenodo.22069468)\n\n**DOI:** [10.5281/zenodo.22069468](https://doi.org/10.5281/zenodo.22069468)"""
          if old not in text:
              raise SystemExit("Expected legacy DOI badge not found in README.md")
          text = text.replace(old, new, 1)
          readme.write_text(text, encoding="utf-8")

          def patch_index(path: str, locale: str, title: str, description: str, hero_src: str, old_hero: str, has_og: bool):
              p = Path(path)
              html = p.read_text(encoding="utf-8")
              og = (
                  f'<meta property="og:type" content="website">'
                  f'<meta property="og:locale" content="{locale}">'
                  f'<meta property="og:title" content="{title}">'
                  f'<meta property="og:description" content="{description}">'
                  f'<meta property="og:image" content="{image_url}">'
                  f'<meta property="og:image:secure_url" content="{image_url}">'
                  f'<meta property="og:image:type" content="image/jpeg">'
                  f'<meta property="og:image:alt" content="AgentMesh Gateway — Faramarz Kowsari">'
                  f'<meta name="twitter:card" content="summary_large_image">'
                  f'<meta name="twitter:title" content="{title}">'
                  f'<meta name="twitter:description" content="{description}">'
                  f'<meta name="twitter:image" content="{image_url}">'
              )
              if has_og:
                  start = html.index('<meta property="og:type" content="website">')
                  end_marker = '<meta name="twitter:card" content="summary_large_image">'
                  end = html.index(end_marker, start) + len(end_marker)
                  html = html[:start] + og + html[end:]
              else:
                  marker = '<meta name="robots" content="index,follow,max-image-preview:large">'
                  if marker not in html:
                      raise SystemExit(f"robots marker missing in {path}")
                  html = html.replace(marker, marker + og, 1)
              if old_hero not in html:
                  raise SystemExit(f"hero image marker missing in {path}")
              html = html.replace(old_hero, hero_src, 1)
              p.write_text(html, encoding="utf-8")

          patch_index(
              "docs/index.html",
              "en_US",
              "AgentMesh Gateway | Protocol-Aware AI Gateway & Routing Research",
              "Feasibility-first AI gateway and reproducible routing research substrate.",
              '<img src="social-preview.jpg" alt="AgentMesh Gateway social preview by Faramarz Kowsari">',
              '<img src="assets/agentmesh-hero.svg" alt="AgentMesh Gateway architecture overview">',
              True,
          )
          patch_index(
              "docs/tr/index.html",
              "tr_TR",
              "AgentMesh Gateway | Protokol-Duyarlı Yapay Zekâ Ağ Geçidi ve Yönlendirme Araştırması",
              "Uygunluk-öncelikli AI gateway ve yeniden üretilebilir yönlendirme araştırma altyapısı.",
              '<img src="../social-preview.jpg" alt="Faramarz Kowsari tarafından AgentMesh Gateway sosyal önizlemesi">',
              '<img src="../assets/agentmesh-hero.svg" alt="AgentMesh Gateway mimari özeti">',
              False,
          )
          patch_index(
              "docs/es/index.html",
              "es_ES",
              "AgentMesh Gateway | Gateway de IA sensible al protocolo e investigación de enrutamiento",
              "Gateway de IA con viabilidad primero y plataforma reproducible para investigación de enrutamiento.",
              '<img src="../social-preview.jpg" alt="Vista previa social de AgentMesh Gateway por Faramarz Kowsari">',
              '<img src="../assets/agentmesh-hero.svg" alt="Resumen visual de la arquitectura de AgentMesh Gateway">',
              False,
          )

          print("Patched README.md and EN/TR/ES index pages.")
          PY
      - name: Verify references
        shell: bash
        run: |
          grep -q 'docs/social-preview.jpg' README.md
          grep -q 'img.shields.io/badge/DOI-10.5281%2Fzenodo.22069468' README.md
          grep -q 'social-preview.jpg' docs/index.html
          grep -q '../social-preview.jpg' docs/tr/index.html
          grep -q '../social-preview.jpg' docs/es/index.html
          grep -q 'twitter:image' docs/index.html
          grep -q 'twitter:image' docs/tr/index.html
          grep -q 'twitter:image' docs/es/index.html
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html docs/tr/index.html docs/es/index.html
          git commit -m "docs: integrate social preview and repair DOI badge"
          git push origin HEAD:chore/social-preview-and-doi
