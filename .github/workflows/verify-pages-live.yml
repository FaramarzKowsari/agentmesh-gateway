name: verify-pages-live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-pages-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live multilingual Pages URLs
        id: probe
        shell: bash
        run: |
          set +e
          urls=(
            "https://faramarzkowsari.github.io/agentmesh-gateway/"
            "https://faramarzkowsari.github.io/agentmesh-gateway/project.html"
            "https://faramarzkowsari.github.io/agentmesh-gateway/tr/"
            "https://faramarzkowsari.github.io/agentmesh-gateway/tr/project.html"
            "https://faramarzkowsari.github.io/agentmesh-gateway/es/"
            "https://faramarzkowsari.github.io/agentmesh-gateway/es/project.html"
          )
          : > /tmp/probe.txt
          failures=0
          for url in "${urls[@]}"; do
            tmp="$(mktemp)"
            code="$(curl -L -sS --max-time 25 -o "${tmp}" -w '%{http_code}' "${url}")"
            title_ok=no
            author_ok=no
            grep -q 'AgentMesh Gateway' "${tmp}" && title_ok=yes
            grep -q 'Faramarz Kowsari' "${tmp}" && author_ok=yes
            printf '%s | HTTP %s | AgentMesh=%s | Author=%s\n' "${url}" "${code}" "${title_ok}" "${author_ok}" >> /tmp/probe.txt
            if [ "${code}" != "200" ] || [ "${title_ok}" != yes ] || [ "${author_ok}" != yes ]; then
              failures=$((failures+1))
            fi
            rm -f "${tmp}"
          done
          cat /tmp/probe.txt
          echo "failures=${failures}" >> "$GITHUB_OUTPUT"
      - name: Record probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.probe.outputs.failures }}
        shell: bash
        run: |
          marker='<!-- agentmesh-pages-independent-probe -->'
          report="$(cat /tmp/probe.txt 2>/dev/null || true)"
          if [ "${FAILURES:-99}" = "0" ]; then
            status='SUCCESS — all six multilingual Pages URLs returned HTTP 200 and expected AgentMesh/author content.'
          else
            status="FAILURE — ${FAILURES:-unknown} URL checks did not pass."
          fi
          body="${marker}

${status}

\`\`\`text
${report}
\`\`\`"
          gh issue comment 44 --body "${body}"
          if [ "${FAILURES:-99}" = "0" ]; then
            gh issue close 44
          fi
