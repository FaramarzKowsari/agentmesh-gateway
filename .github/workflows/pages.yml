name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate static site
        run: |
          test -f docs/index.html
          test -f docs/project.html
          test -f docs/tr/index.html
          test -f docs/tr/project.html
          test -f docs/es/index.html
          test -f docs/es/project.html
          test -f docs/assets/site.css
          test -f docs/assets/agentmesh-hero.svg
          grep -q 'Faramarz Kowsari' docs/index.html
          grep -q '10.5281/zenodo.22069468' docs/index.html
          grep -q 'Faramarz Kowsari' docs/tr/index.html
          grep -q 'Faramarz Kowsari' docs/es/index.html
          grep -q 'project.html' docs/index.html
          grep -q 'project.html' docs/tr/index.html
          grep -q 'project.html' docs/es/index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live multilingual site
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}/"
          urls=(
            "${base}"
            "${base}project.html"
            "${base}tr/"
            "${base}tr/project.html"
            "${base}es/"
            "${base}es/project.html"
          )
          for url in "${urls[@]}"; do
            echo "Verifying ${url}"
            body="$(curl -fsSL --retry 30 --retry-delay 5 --retry-all-errors "${url}")"
            printf '%s' "${body}" | grep -q 'AgentMesh Gateway'
            printf '%s' "${body}" | grep -q 'Faramarz Kowsari'
          done
