name: package-v0.3.0-portables

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-v0.3.0-portables.yml"

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    name: v0.3.0 portable (${{ runner.os }} / ${{ runner.arch }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.3.0
          fetch-depth: 0

      - name: Overlay release-only portable launcher and spec from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p packaging
          git show origin/main:src/agentmesh/portable.py > src/agentmesh/portable.py
          git show origin/main:packaging/agentmesh.spec > packaging/agentmesh.spec

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install v0.3.0 and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.11,<7"

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm --distpath dist packaging/agentmesh.spec

      - name: Name binary and write SHA-256
        shell: python
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          from __future__ import annotations

          import hashlib
          import os
          import shutil
          from pathlib import Path

          os_name = os.environ["RUNNER_OS_NAME"]
          arch = os.environ["RUNNER_ARCH_NAME"].lower()
          extension = ".exe" if os_name == "Windows" else ""
          source = Path("dist") / f"AgentMesh-Gateway{extension}"
          if not source.is_file():
              raise SystemExit(f"missing PyInstaller output: {source}")

          slug = {"Windows": "windows", "Linux": "linux", "macOS": "macos"}[os_name]
          release_dir = Path("release")
          release_dir.mkdir(exist_ok=True)
          target = release_dir / f"AgentMesh-Gateway-{slug}-{arch}{extension}"
          shutil.copy2(source, target)
          if os_name != "Windows":
              target.chmod(0o755)

          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_name(target.name + ".sha256").write_text(
              f"{digest}  {target.name}\n",
              encoding="utf-8",
          )

      - name: Smoke-test v0.3.0 standalone executable
        shell: python
        run: |
          from __future__ import annotations

          import json
          import subprocess
          import time
          import urllib.request
          from pathlib import Path

          binaries = [path for path in Path("release").iterdir() if not path.name.endswith(".sha256")]
          if len(binaries) != 1:
              raise SystemExit(f"expected one binary, found: {binaries}")
          binary = binaries[0].resolve()

          version = subprocess.run(
              [str(binary), "version"],
              check=True,
              capture_output=True,
              text=True,
              timeout=60,
          ).stdout.strip()
          if version != "0.3.0":
              raise SystemExit(f"expected v0.3.0 binary, got {version!r}")

          process = subprocess.Popen(
              [str(binary), "serve", "--host", "127.0.0.1", "--port", "18787"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          try:
              deadline = time.time() + 75
              payload = None
              while time.time() < deadline:
                  if process.poll() is not None:
                      output = process.stdout.read() if process.stdout else ""
                      raise SystemExit(f"gateway exited early with {process.returncode}:\n{output}")
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:18787/healthz", timeout=2) as response:
                          if response.status == 200:
                              payload = response.read().decode("utf-8")
                              break
                  except Exception:
                      time.sleep(1)
              if payload is None:
                  raise SystemExit("standalone gateway did not become healthy within 75 seconds")
              json.loads(payload)
          finally:
              process.terminate()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=10)

      - name: Keep build artifact
        uses: actions/upload-artifact@v7
        with:
          name: v0.3.0-portable-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error

      - name: Upload to existing v0.3.0 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v0.3.0 >/dev/null
          gh release upload v0.3.0 release/* --clobber

  report:
    name: report portable verification
    if: always()
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Report aggregate matrix result to Issue 55
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_RESULT: ${{ needs.build-and-publish.result }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 55 --body "Portable v0.3.0 matrix result: **${MATRIX_RESULT}**. Actions run: ${run_url}"
          if [ "${MATRIX_RESULT}" = "success" ]; then
            gh issue close 55 --reason completed
          else
            exit 1
          fi
