name: apply-zenodo-citation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[zenodo-metadata-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply DOI badge and citation links
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          badge = "[![DOI](https://zenodo.org/badge/1343123888.svg)](https://doi.org/10.5281/zenodo.22069468)"
          if badge not in text:
              text = text.replace("# AgentMesh Gateway\n\n", f"# AgentMesh Gateway\n\n{badge}\n\n", 1)

          heading = "## Citation and archival"
          section = """## Citation and archival

          AgentMesh Gateway is archived through the Zenodo–GitHub integration.

          - Repository DOI displayed by Zenodo: `10.5281/zenodo.22069469`
          - Archived v0.3.0 DOI used by the official Zenodo badge and `CITATION.cff`: `10.5281/zenodo.22069468`
          - Citation metadata: [CITATION.cff](CITATION.cff)
          - Citation guidance: [docs/CITATION.md](docs/CITATION.md)

          For exact reproducibility of v0.3.0, cite `https://doi.org/10.5281/zenodo.22069468`.

          """
          if heading not in text:
              marker = "## Release notes and roadmap\n"
              if marker not in text:
                  raise SystemExit("README release-notes marker not found")
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding="utf-8")

          notes = Path("RELEASE_NOTES_v0.3.0.md")
          release_text = notes.read_text(encoding="utf-8")
          if "## Archival and DOI" not in release_text:
              release_text += """

          ## Archival and DOI

          This release is archived through the Zenodo–GitHub integration.

          - Release DOI: `10.5281/zenodo.22069468`
          - Repository DOI displayed by Zenodo: `10.5281/zenodo.22069469`
          - Citation metadata is available in `CITATION.cff`.
          """
          notes.write_text(release_text, encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-zenodo-citation.yml
      - name: Commit generated citation placement
        run: |
          if git diff --quiet; then
            echo "No generated citation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_NOTES_v0.3.0.md .github/workflows/apply-zenodo-citation.yml
          git commit -m "docs: publish Zenodo citation metadata [zenodo-metadata-applied]"
          git push origin HEAD:main
